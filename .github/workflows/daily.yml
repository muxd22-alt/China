name: Daily dashboard refresh

on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC = 08:00 Riyadh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-dashboard-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh rates, news, decisions and brief
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/update.mjs

      - name: Cache Laya weights (~1.7 GB, downloaded once)
        if: hashFiles('data/inbox.json') != ''
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/receptron-laya
            ~/.npm
          key: laya-onnx-v1

      - name: Judge inbox listings with Laya (advisory, never blocks the refresh)
        if: hashFiles('data/inbox.json') != ''
        continue-on-error: true
        run: |
          npm install --no-save --no-audit --no-fund @receptron/laya
          node scripts/judge.mjs
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'nvidia/nemotron-3-super-120b-a12b:free' }}
          MAX_LLM_CALLS: "20"
          # LAYA_SUBFOLDER: multilingual   # uncomment only when the ONNX repo publishes that folder

      - name: Commit refreshed data
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: daily data refresh $(date -u +%F)"
            git push
          fi
