name: Daily dashboard refresh

on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC = 08:00 Riyadh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-dashboard-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh rates, news and signals
        run: node scripts/update.mjs

      - name: Commit refreshed data
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: daily data refresh $(date -u +%F)"
            git push
          fi
